name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build static site (dist/)
        run: node scripts/build-static.mjs

      - name: Verify static build output (deploy safety net)
        run: node scripts/build-static.mjs --check

      # ubuntu-latest ships Google Chrome preinstalled at /usr/bin/google-chrome
      # (see actions/runner-images install-google-chrome.sh). Prefer that -
      # it needs no extra action and scripts/smoke.mjs already looks for it -
      # and only fall back to browser-actions/setup-chrome if a future
      # runner image ever drops it.
      - name: Locate a Chrome binary
        id: chrome
        run: |
          if [ -x /usr/bin/google-chrome ]; then
            echo "path=/usr/bin/google-chrome" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Chrome (fallback only, if not preinstalled)
        if: steps.chrome.outputs.path == ''
        id: setup_chrome
        uses: browser-actions/setup-chrome@v2
        continue-on-error: true

      # This e2e suite needs a real Chrome + WASM inside the GitHub-hosted
      # runner, which could not be verified against an actual GitHub Actions
      # run from the sandbox this workflow was authored in. It is
      # intentionally non-blocking: a failure here must never redden the
      # build. See the CI section of the deploy report for details.
      - name: Run headless-Chrome e2e smoke test (non-blocking)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path || steps.setup_chrome.outputs.chrome-path }}
        run: npm run test:e2e
        continue-on-error: true
