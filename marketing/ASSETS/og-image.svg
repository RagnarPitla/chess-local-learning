<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>Chess Local Learning - free, open-source chess trainer</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="590" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <text x="64" y="108" font-size="22" font-weight="600" letter-spacing="2" fill="#737373">FREE AND OPEN SOURCE - RUNS IN YOUR BROWSER</text>

  <text x="62" y="212" font-size="72" font-weight="700" fill="#0a0a0a">Chess Local Learning</text>

  <text x="64" y="266" font-size="30" fill="#404040">Turns your own games into your own curriculum.</text>
  <text x="64" y="306" font-size="30" fill="#404040">Explains every mistake. Never leaves your browser.</text>

  <line x1="64" y1="520" x2="1136" y2="520" stroke="#e5e5e5" stroke-width="1"/>
  <text x="64" y="558" font-size="22" fill="#737373">github.com/RagnarPitla/chess-local-learning</text>
  <text x="1136" y="558" font-size="22" fill="#737373" text-anchor="end">MIT licensed</text>

  <!-- faceted low-poly rook mark -->
  <g transform="translate(895,160) scale(1.35)">
    <polygon points="50,225 100,225 100,205 60,205" fill="#0a0a0a"/>
    <polygon points="100,225 150,225 140,205 100,205" fill="#171717"/>
    <polygon points="60,205 100,205 96,90 72,90" fill="#0a0a0a"/>
    <polygon points="100,205 140,205 128,90 96,90" fill="#171717"/>
    <polygon points="55,90 100,90 100,65 55,65" fill="#0a0a0a"/>
    <polygon points="100,90 145,90 145,65 100,65" fill="#171717"/>
    <rect x="55" y="40" width="22" height="25" fill="#0a0a0a"/>
    <rect x="89" y="40" width="22" height="25" fill="#0a0a0a"/>
    <rect x="123" y="40" width="22" height="25" fill="#171717"/>
    <g stroke="#ffffff" stroke-width="1.5">
      <line x1="100" y1="225" x2="100" y2="205"/>
      <line x1="100" y1="205" x2="96" y2="90"/>
      <line x1="100" y1="90" x2="100" y2="65"/>
    </g>
  </g>
</svg>
