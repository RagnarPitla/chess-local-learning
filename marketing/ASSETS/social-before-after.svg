<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Chess Local Learning - before and after your review</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <text x="600" y="100" font-size="20" font-weight="600" letter-spacing="2" fill="#737373" text-anchor="middle">BEFORE AND AFTER YOUR REVIEW</text>
  <text x="600" y="132" font-size="18" fill="#737373" text-anchor="middle">Illustrative example, not a captured game.</text>

  <!-- left: raw evaluation -->
  <rect x="40" y="180" width="528" height="340" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
  <text x="80" y="234" font-size="18" font-weight="600" letter-spacing="1.5" fill="#737373">TYPICAL ENGINE REVIEW</text>
  <text x="80" y="356" font-size="70" font-weight="700" fill="#0a0a0a">-140</text>
  <text x="80" y="390" font-size="20" fill="#737373">centipawns lost</text>
  <text x="80" y="444" font-size="24" fill="#404040">Best move was Nd7.</text>

  <!-- arrow -->
  <polygon points="588,335 588,365 614,350" fill="#0a0a0a"/>

  <!-- right: chess local learning review -->
  <rect x="632" y="180" width="528" height="340" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/>
  <text x="672" y="234" font-size="18" font-weight="600" letter-spacing="1.5" fill="#737373">CHESS LOCAL LEARNING</text>
  <text x="672" y="286" font-size="34" font-weight="700" fill="#0a0a0a">Overloaded defender</text>
  <text x="672" y="328" font-size="22" fill="#404040">One piece was the only defender</text>
  <text x="672" y="356" font-size="22" fill="#404040">of two things at once - losing one</text>
  <text x="672" y="384" font-size="22" fill="#404040">was forced.</text>
  <text x="672" y="444" font-size="20" fill="#737373">Added to your spaced-repetition drills.</text>
</svg>
