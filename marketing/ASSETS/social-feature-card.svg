<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Chess Local Learning - every mistake gets a name</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <text x="600" y="110" font-size="20" font-weight="600" letter-spacing="2" fill="#737373" text-anchor="middle">NOT JUST A WORSE NUMBER</text>
  <text x="600" y="205" font-size="54" font-weight="700" fill="#0a0a0a" text-anchor="middle">Every mistake gets a name</text>
  <text x="600" y="250" font-size="25" fill="#404040" text-anchor="middle">24 named tactical and positional patterns,</text>
  <text x="600" y="282" font-size="25" fill="#404040" text-anchor="middle">detected directly in your own games.</text>

  <!-- pattern chips: real labels from public/js/patterns.js -->
  <g font-size="22" fill="#0a0a0a">
    <rect x="189" y="340" width="290" height="56" rx="28" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <text x="334" y="376" text-anchor="middle">Left a piece hanging</text>

    <rect x="503" y="340" width="278" height="56" rx="28" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <text x="642" y="376" text-anchor="middle">Overloaded defender</text>

    <rect x="805" y="340" width="206" height="56" rx="28" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <text x="908" y="376" text-anchor="middle">Missed a fork</text>

    <rect x="292" y="420" width="266" height="56" rx="28" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <text x="425" y="456" text-anchor="middle">Back rank weakness</text>

    <rect x="582" y="420" width="326" height="56" rx="28" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <text x="745" y="456" text-anchor="middle">Allowed a pin or skewer</text>
  </g>

  <text x="600" y="560" font-size="22" fill="#737373" text-anchor="middle">Detected automatically, every time you review a game.</text>

  <!-- small pawn mark, bottom right -->
  <g transform="translate(1085,570) scale(0.3)">
    <polygon points="50,225 100,225 100,208 62,208" fill="#0a0a0a"/>
    <polygon points="100,225 150,225 138,208 100,208" fill="#171717"/>
    <polygon points="65,208 100,208 100,196 72,196" fill="#0a0a0a"/>
    <polygon points="100,208 135,208 128,196 100,196" fill="#171717"/>
    <polygon points="78,196 100,196 100,140 88,140" fill="#0a0a0a"/>
    <polygon points="100,196 122,196 112,140 100,140" fill="#171717"/>
    <polygon points="82,140 100,140 100,128 82,128" fill="#0a0a0a"/>
    <polygon points="100,140 118,140 118,128 100,128" fill="#171717"/>
    <circle cx="100" cy="100" r="32" fill="#0a0a0a"/>
    <path d="M100,68 A32,32 0 0 1 100,132 Z" fill="#171717"/>
  </g>
</svg>
