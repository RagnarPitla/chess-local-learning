<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Chess Local Learning - the learning loop</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <text x="600" y="90" font-size="22" font-weight="600" letter-spacing="2" fill="#737373" text-anchor="middle">THE LEARNING LOOP</text>

  <!-- five boxes -->
  <g font-size="24" font-weight="700" fill="#0a0a0a">
    <rect x="40" y="250" width="200" height="110" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <rect x="270" y="250" width="200" height="110" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <rect x="500" y="250" width="200" height="110" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <rect x="730" y="250" width="200" height="110" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
    <rect x="960" y="250" width="200" height="110" rx="8" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="2"/>
  </g>

  <g font-size="15" font-weight="700" fill="#ffffff">
    <circle cx="58" cy="268" r="14" fill="#0a0a0a"/>
    <text x="58" y="273" text-anchor="middle">1</text>
    <circle cx="288" cy="268" r="14" fill="#0a0a0a"/>
    <text x="288" y="273" text-anchor="middle">2</text>
    <circle cx="518" cy="268" r="14" fill="#0a0a0a"/>
    <text x="518" y="273" text-anchor="middle">3</text>
    <circle cx="748" cy="268" r="14" fill="#0a0a0a"/>
    <text x="748" y="273" text-anchor="middle">4</text>
    <circle cx="978" cy="268" r="14" fill="#0a0a0a"/>
    <text x="978" y="273" text-anchor="middle">5</text>
  </g>

  <g font-size="19" font-weight="600" fill="#0a0a0a" text-anchor="middle">
    <text x="140" y="308">Play or import</text>
    <text x="140" y="332" font-size="16" font-weight="400" fill="#737373">a real game</text>

    <text x="370" y="308">Engine reviews</text>
    <text x="370" y="332" font-size="16" font-weight="400" fill="#737373">every position</text>

    <text x="600" y="308">Mistakes get</text>
    <text x="600" y="332" font-size="16" font-weight="400" fill="#737373">a named pattern</text>

    <text x="830" y="308">Weakest patterns</text>
    <text x="830" y="332" font-size="16" font-weight="400" fill="#737373">rank first</text>

    <text x="1060" y="308">Spaced drills</text>
    <text x="1060" y="332" font-size="16" font-weight="400" fill="#737373">bring it back</text>
  </g>

  <!-- forward arrows between boxes -->
  <g stroke="#0a0a0a" stroke-width="2.5">
    <line x1="240" y1="305" x2="266" y2="305"/>
    <line x1="470" y1="305" x2="496" y2="305"/>
    <line x1="700" y1="305" x2="726" y2="305"/>
    <line x1="930" y1="305" x2="956" y2="305"/>
  </g>
  <g fill="#0a0a0a">
    <polygon points="270,305 258,299 258,311"/>
    <polygon points="500,305 488,299 488,311"/>
    <polygon points="730,305 718,299 718,311"/>
    <polygon points="960,305 948,299 948,311"/>
  </g>

  <!-- return arrow, box 5 back to box 1 -->
  <path d="M 1060,362 C 1060,480 140,480 140,362" fill="none" stroke="#171717" stroke-width="2.5"/>
  <polygon points="140,362 132,376 149,376" fill="#171717"/>

  <text x="600" y="545" font-size="20" fill="#737373" text-anchor="middle">Every game feeds the next drill.</text>
</svg>
