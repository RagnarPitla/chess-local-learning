<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <title>Chess Local Learning - lessons teach trees, opponents play graphs</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="20" y="20" width="1160" height="635" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/>

  <line x1="600" y1="118" x2="600" y2="565" stroke="#e5e5e5" stroke-width="2"/>

  <text x="300" y="95" font-size="20" font-weight="600" letter-spacing="2" fill="#737373" text-anchor="middle">WHAT LESSONS TEACH</text>
  <text x="900" y="95" font-size="20" font-weight="600" letter-spacing="2" fill="#737373" text-anchor="middle">WHAT OPPONENTS PLAY</text>

  <!-- tree: one memorised path highlighted, everything else muted -->
  <g>
    <line x1="300" y1="150" x2="240" y2="250" stroke="#0a0a0a" stroke-width="3"/>
    <line x1="300" y1="150" x2="360" y2="250" stroke="#737373" stroke-width="1.5"/>
    <line x1="240" y1="250" x2="200" y2="350" stroke="#0a0a0a" stroke-width="3"/>
    <line x1="240" y1="250" x2="270" y2="350" stroke="#737373" stroke-width="1.5"/>
    <line x1="360" y1="250" x2="330" y2="350" stroke="#737373" stroke-width="1.5"/>
    <line x1="360" y1="250" x2="400" y2="350" stroke="#737373" stroke-width="1.5"/>
    <circle cx="300" cy="150" r="9" fill="#0a0a0a"/>
    <circle cx="240" cy="250" r="8" fill="#0a0a0a"/>
    <circle cx="360" cy="250" r="8" fill="#0a0a0a"/>
    <circle cx="200" cy="350" r="7" fill="#0a0a0a"/>
    <circle cx="270" cy="350" r="7" fill="#0a0a0a"/>
    <circle cx="330" cy="350" r="7" fill="#0a0a0a"/>
    <circle cx="400" cy="350" r="7" fill="#0a0a0a"/>
  </g>

  <!-- graph: dense mesh, nothing highlighted, no single path -->
  <g>
    <line x1="860" y1="160" x2="960" y2="150" stroke="#737373" stroke-width="1.5"/>
    <line x1="860" y1="160" x2="900" y2="230" stroke="#737373" stroke-width="1.5"/>
    <line x1="960" y1="150" x2="900" y2="230" stroke="#737373" stroke-width="1.5"/>
    <line x1="900" y1="230" x2="830" y2="300" stroke="#737373" stroke-width="1.5"/>
    <line x1="900" y1="230" x2="970" y2="310" stroke="#737373" stroke-width="1.5"/>
    <line x1="830" y1="300" x2="890" y2="350" stroke="#737373" stroke-width="1.5"/>
    <line x1="970" y1="310" x2="890" y2="350" stroke="#737373" stroke-width="1.5"/>
    <line x1="970" y1="310" x2="1000" y2="250" stroke="#737373" stroke-width="1.5"/>
    <line x1="1000" y1="250" x2="960" y2="150" stroke="#737373" stroke-width="1.5"/>
    <line x1="830" y1="300" x2="1000" y2="250" stroke="#737373" stroke-width="1.5"/>
    <circle cx="860" cy="160" r="8" fill="#0a0a0a"/>
    <circle cx="960" cy="150" r="8" fill="#0a0a0a"/>
    <circle cx="900" cy="230" r="8" fill="#0a0a0a"/>
    <circle cx="830" cy="300" r="8" fill="#0a0a0a"/>
    <circle cx="970" cy="310" r="8" fill="#0a0a0a"/>
    <circle cx="890" cy="350" r="7" fill="#0a0a0a"/>
    <circle cx="1000" cy="250" r="7" fill="#0a0a0a"/>
  </g>

  <text x="300" y="410" font-size="26" fill="#404040" text-anchor="middle">"If they play X, you play Y."</text>
  <text x="900" y="410" font-size="26" fill="#404040" text-anchor="middle">"Anything legal."</text>

  <!-- small rook mark as a pivot between the two halves -->
  <g transform="translate(587,452) scale(0.13)">
    <polygon points="50,225 100,225 100,205 60,205" fill="#0a0a0a"/>
    <polygon points="100,225 150,225 140,205 100,205" fill="#171717"/>
    <polygon points="60,205 100,205 96,90 72,90" fill="#0a0a0a"/>
    <polygon points="100,205 140,205 128,90 96,90" fill="#171717"/>
    <polygon points="55,90 100,90 100,65 55,65" fill="#0a0a0a"/>
    <polygon points="100,90 145,90 145,65 100,65" fill="#171717"/>
    <rect x="55" y="40" width="22" height="25" fill="#0a0a0a"/>
    <rect x="89" y="40" width="22" height="25" fill="#0a0a0a"/>
    <rect x="123" y="40" width="22" height="25" fill="#171717"/>
  </g>

  <text x="600" y="545" font-size="32" font-weight="700" fill="#0a0a0a" text-anchor="middle">Chess Local Learning is built for the graph</text>
  <text x="600" y="582" font-size="22" fill="#737373" text-anchor="middle">Free. Open source. Runs entirely in your browser.</text>
</svg>
