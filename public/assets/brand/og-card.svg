  <text x="230" y="178" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="112" font-weight="800" letter-spacing="-2" fill="#0a0a0a">Ramify</text>

  <text x="100" y="280" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="36" font-weight="500" fill="#404040">Chess training built from your own games.</text>

