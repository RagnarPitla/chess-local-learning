    <path fill="#0a0a0a" d="M50,14 L59.9,18.1 L64,28 L59.9,37.9 L58,44 L68,70 L72,75 L80,88 L20,88 L28,75 L32,70 L42,44 L40.1,37.9 L36,28 L40.1,18.1 Z"/>
